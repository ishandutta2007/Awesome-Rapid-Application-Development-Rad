<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Radial Glowing Orbs without feGaussianBlur -->
    <radialGradient id="cyan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="indigo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.30" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purple-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#c084fc" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="0.75">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <!-- Glowing Ambient Lights with SMIL Pulsing -->
  <circle cx="150" cy="80" r="160" fill="url(#cyan-glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1020" cy="180" r="220" fill="url(#indigo-glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite" />
  </circle>
  <circle cx="680" cy="300" r="180" fill="url(#purple-glow)">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Flowing Dynamic Data Stream Lines with SMIL -->
  <path d="M 50 310 Q 350 210 650 300 T 1150 230" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 8" opacity="0.35">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="2s" repeatCount="indefinite" />
  </path>
  <path d="M 80 70 Q 400 150 700 60 T 1120 120" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.35">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="2.5s" repeatCount="indefinite" />
  </path>

  <!-- Dynamic Floating Feature Badges (SMIL transform animations, strictly in right-hand quadrant) -->
  <!-- Pill 1: Drag & Drop UI -->
  <g transform="translate(860, 50)">
    <animateTransform attributeName="transform" type="translate" values="860,50; 860,42; 860,50" dur="5s" repeatCount="indefinite" />
    <rect width="190" height="40" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5" />
    <circle cx="24" cy="20" r="6" fill="#38bdf8" />
    <text x="42" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="13" fill="#cbd5e1">⚡ Drag &amp; Drop UI</text>
  </g>

  <!-- Pill 2: Instant Database APIs -->
  <g transform="translate(920, 115)">
    <animateTransform attributeName="transform" type="translate" values="920,115; 920,123; 920,115" dur="6s" repeatCount="indefinite" />
    <rect width="220" height="40" rx="20" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.5" />
    <circle cx="24" cy="20" r="6" fill="#818cf8" />
    <text x="42" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="13" fill="#cbd5e1">🔌 Instant Database APIs</text>
  </g>

  <!-- Pill 3: Self-Hosted & Cloud -->
  <g transform="translate(880, 180)">
    <animateTransform attributeName="transform" type="translate" values="880,180; 880,172; 880,180" dur="5.5s" repeatCount="indefinite" />
    <rect width="230" height="40" rx="20" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.5" stroke-width="1.5" />
    <circle cx="24" cy="20" r="6" fill="#c084fc" />
    <text x="42" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="13" fill="#cbd5e1">🛡️ Self-Hosted &amp; Cloud</text>
  </g>

  <!-- Pill 4: Workflow Automation -->
  <g transform="translate(940, 245)">
    <animateTransform attributeName="transform" type="translate" values="940,245; 940,253; 940,245" dur="6.5s" repeatCount="indefinite" />
    <rect width="200" height="40" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="24" cy="20" r="6" fill="#38bdf8" />
    <text x="42" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="13" fill="#cbd5e1">🤖 Workflow Engines</text>
  </g>

  <!-- Foreground Title and Core Identity (Always in foreground, never obscured) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill Tag -->
    <g transform="translate(0, 68)">
      <rect width="320" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="16" cy="16" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="13" fill="#38bdf8" letter-spacing="0.8">CURATED ENGINEERING DIRECTORY</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="44" fill="#ffffff" letter-spacing="-0.5">Awesome Rapid Application</text>
    <text x="0" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="44" fill="url(#title-grad)" letter-spacing="-0.5">Development (RAD)</text>

    <!-- Subtitle -->
    <text x="0" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#94a3b8" letter-spacing="0.2">
      The ultimate guide to Low-Code, No-Code, Internal Tools &amp; Admin Panel Builders
    </text>

    <!-- Meta Highlights -->
    <g transform="translate(0, 285)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#64748b">
        ⭐ Top Open-Source Frameworks &nbsp;•&nbsp; 🏢 Enterprise SaaS &nbsp;•&nbsp; 📊 Pricing &amp; Market Insights
      </text>
    </g>
  </g>
</svg>
