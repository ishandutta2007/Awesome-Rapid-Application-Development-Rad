<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glow-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.03" />
    </linearGradient>

    <!-- Filter for subtle neon glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }
      .card-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #cbd5e1;
      }
      
      /* Dynamic Ambient Animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashStream {
        to { stroke-dashoffset: -40; }
      }

      .floating-pill-1 { animation: floatSlow 6s ease-in-out infinite; }
      .floating-pill-2 { animation: floatSlow 7s ease-in-out infinite 1s; }
      .floating-pill-3 { animation: floatFast 5s ease-in-out infinite 0.5s; }
      .pulsing-orb { animation: pulseGlow 8s ease-in-out infinite alternate; transform-origin: center; }
      .data-stream { stroke-dasharray: 6, 6; animation: dashStream 2s linear infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Background Grid Pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.75">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <!-- Ambient Blurred Glowing Orbs (Dynamic Background) -->
  <g class="pulsing-orb" opacity="0.45">
    <circle cx="200" cy="80" r="140" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="1020" cy="190" r="160" fill="#818cf8" filter="url(#glow)" />
    <circle cx="650" cy="320" r="110" fill="#c084fc" filter="url(#glow)" />
  </g>

  <!-- Flowing Dynamic Data Stream Lines -->
  <g fill="none" opacity="0.4">
    <path d="M 50 300 Q 350 200 650 290 T 1150 220" stroke="#38bdf8" stroke-width="2" class="data-stream" />
    <path d="M 80 80 Q 400 160 700 70 T 1120 130" stroke="#818cf8" stroke-width="1.5" class="data-stream" />
  </g>

  <!-- Floating Dynamic Feature Badges / Cards (Background Accents) -->
  <g class="floating-pill-1" transform="translate(850, 45)">
    <rect width="180" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="24" cy="21" r="6" fill="#38bdf8" />
    <text x="42" y="26" class="card-label">⚡ Drag &amp; Drop UI</text>
  </g>

  <g class="floating-pill-2" transform="translate(930, 110)">
    <rect width="210" height="42" rx="21" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="24" cy="21" r="6" fill="#818cf8" />
    <text x="42" y="26" class="card-label">🔌 Instant Database APIs</text>
  </g>

  <g class="floating-pill-3" transform="translate(870, 175)">
    <rect width="220" height="42" rx="21" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="24" cy="21" r="6" fill="#c084fc" />
    <text x="42" y="26" class="card-label">🛡️ Self-Hosted &amp; Cloud</text>
  </g>

  <!-- Foreground Title and Core Identity (Never Obscured) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill Tag -->
    <g transform="translate(0, 68)">
      <rect width="320" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="16" cy="16" r="4" fill="#38bdf8" />
      <text x="30" y="21" class="badge-text">Curated Engineering Directory</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="155" class="title-text">Awesome Rapid Application</text>
    <text x="0" y="208" class="title-text" fill="url(#accent-grad)">Development (RAD)</text>

    <!-- Subtitle -->
    <text x="0" y="258" class="subtitle-text">
      The ultimate guide to Low-Code, No-Code, Internal Tools &amp; Admin Panel Builders
    </text>

    <!-- Meta Highlights -->
    <g transform="translate(0, 285)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748b">
        ⭐ Top Open-Source Frameworks &nbsp;•&nbsp; 🏢 Enterprise SaaS &nbsp;•&nbsp; 📊 Pricing &amp; Market Insights
      </text>
    </g>
  </g>
</svg>
